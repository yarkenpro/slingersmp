<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlingerSMP</title>
<style>
  :root{
    --grass:#5aae3a;
    --grass-dark:#3f7d27;
    --dirt:#7a5230;
    --dirt-dark:#5a3b21;
    --stone:#8f8f8f;
    --gold:#f7d54a;
    --diamond:#48e0d4;
    --redstone:#e0402c;
    --ink:#1c150e;
    --paper:#f4ecd8;
    --shadow:rgba(0,0,0,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    overflow-x:hidden;
    image-rendering:pixelated;
  }
  h1,h2,h3,.pix{
    font-family:"Courier New",monospace;
    font-weight:900;
    letter-spacing:1px;
    text-transform:uppercase;
  }

  /* ===== Animated sky + parallax pixels ===== */
  #sky{
    position:fixed;inset:0;z-index:-3;
    background:#5fb4ff;
  }
  #clouds{position:fixed;inset:0;z-index:-2;pointer-events:none}
  .cloud{
    position:absolute;
    background:#fff;
    box-shadow:24px 0 #fff,-24px 0 #fff,0 -20px #fff,44px -8px #fff,-44px -8px #fff;
    border-radius:2px;
    opacity:.9;
    animation:drift linear infinite;
  }
  @keyframes drift{
    from{transform:translateX(-20vw)}
    to{transform:translateX(120vw)}
  }
  /* falling voxels */
  #voxels{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
  .vox{
    position:absolute;top:-40px;width:22px;height:22px;
    border:3px solid rgba(0,0,0,.25);
    animation:fall linear infinite;
    opacity:.55;
  }
  @keyframes fall{
    to{transform:translateY(115vh) rotate(360deg)}
  }

  /* ===== Pixel button ===== */
  .btn{
    display:inline-block;
    font-family:"Courier New",monospace;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#fff;
    text-decoration:none;
    padding:16px 26px;
    background:var(--grass);
    border:none;
    cursor:pointer;
    position:relative;
    box-shadow:
      0 6px 0 var(--grass-dark),
      6px 0 0 var(--grass-dark),
      -6px 0 0 var(--grass-dark),
      0 -0 0 var(--grass-dark),
      6px 6px 0 var(--grass-dark),
      -6px 6px 0 var(--grass-dark);
    transition:transform .08s ease, filter .15s ease;
    image-rendering:pixelated;
  }
  .btn:active{transform:translateY(5px)}
  .btn:hover{filter:brightness(1.12) saturate(1.15)}
  .btn.gold{background:var(--gold);color:var(--ink);
    box-shadow:0 6px 0 #b8960f,6px 0 0 #b8960f,-6px 0 0 #b8960f,6px 6px 0 #b8960f,-6px 6px 0 #b8960f;}
  .btn.diamond{background:var(--diamond);color:var(--ink);
    box-shadow:0 6px 0 #1f9b91,6px 0 0 #1f9b91,-6px 0 0 #1f9b91,6px 6px 0 #1f9b91,-6px 6px 0 #1f9b91;}
  .btn.red{background:var(--redstone);
    box-shadow:0 6px 0 #932116,6px 0 0 #932116,-6px 0 0 #932116,6px 6px 0 #932116,-6px 6px 0 #932116;}

  /* ===== Top bar ===== */
  header{
    position:sticky;top:0;z-index:50;
    background:var(--ink);
    border-bottom:5px solid #000;
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 20px;
    flex-wrap:wrap;gap:10px;
  }
  .logo{
    display:flex;align-items:center;gap:12px;color:#fff;font-size:1.3rem;
  }
  .logo .cube{
    width:30px;height:30px;
    background:linear-gradient(135deg,var(--grass) 50%,var(--dirt) 50%);
    box-shadow:inset 0 0 0 3px #000;
    animation:spin 6s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  nav{display:flex;gap:8px;flex-wrap:wrap}
  nav a{
    color:#cfcfcf;text-decoration:none;font-family:"Courier New",monospace;
    font-weight:700;font-size:.85rem;padding:6px 10px;text-transform:uppercase;
    border:2px solid transparent;
  }
  nav a:hover{color:var(--gold);border-color:var(--gold)}

  /* ===== Hero ===== */
  .hero{
    min-height:88vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:60px 20px 40px;position:relative;
  }
  .badge{
    display:inline-block;background:var(--redstone);color:#fff;
    font-family:"Courier New",monospace;font-weight:900;font-size:.8rem;
    padding:7px 14px;letter-spacing:2px;margin-bottom:22px;
    box-shadow:4px 4px 0 rgba(0,0,0,.4);
    animation:wobble 2.5s ease-in-out infinite;
  }
  @keyframes wobble{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  .hero h1{
    font-size:clamp(3rem,13vw,8.5rem);
    line-height:.9;
    color:#fff;
    text-shadow:
      5px 5px 0 var(--dirt-dark),
      8px 8px 0 rgba(0,0,0,.35);
    margin-bottom:8px;
  }
  .hero h1 .green{color:var(--grass)}
  .tag{
    font-family:"Courier New",monospace;font-weight:700;
    font-size:clamp(1rem,3vw,1.5rem);color:var(--ink);
    background:var(--paper);padding:8px 18px;display:inline-block;
    box-shadow:4px 4px 0 rgba(0,0,0,.3);margin-bottom:12px;
  }
  .java-note{
    margin:6px 0 26px;font-weight:900;color:var(--dirt-dark);
    font-family:"Courier New",monospace;font-size:.95rem;letter-spacing:1px;
  }
  .java-note span{background:var(--gold);padding:2px 8px;box-shadow:3px 3px 0 rgba(0,0,0,.25)}
  .cta{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:10px}

  /* IP box */
  .ipbox{
    margin-top:34px;background:var(--ink);color:#fff;
    display:inline-flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;
    padding:14px 20px;box-shadow:6px 6px 0 rgba(0,0,0,.4);
  }
  .ipbox code{
    font-family:"Courier New",monospace;font-size:1.15rem;font-weight:900;
    color:var(--diamond);letter-spacing:1px;
  }
  .copybtn{
    font-family:"Courier New",monospace;font-weight:900;cursor:pointer;
    background:var(--grass);color:#fff;border:none;padding:9px 14px;
    box-shadow:0 4px 0 var(--grass-dark);text-transform:uppercase;font-size:.8rem;
  }
  .copybtn:active{transform:translateY(4px);box-shadow:none}

  /* grass strip divider */
  .grass-strip{
    height:34px;
    background:
      repeating-linear-gradient(90deg,var(--grass) 0 34px,var(--grass-dark) 34px 68px);
    border-top:5px solid #000;border-bottom:5px solid #000;
    box-shadow:inset 0 -14px 0 rgba(0,0,0,.15);
  }

  /* ===== Sections ===== */
  section{padding:70px 20px}
  .wrap{max-width:1080px;margin:0 auto}
  .sec-title{
    text-align:center;font-size:clamp(1.8rem,6vw,3rem);margin-bottom:8px;
    color:var(--ink);text-shadow:3px 3px 0 rgba(0,0,0,.15);
  }
  .sec-sub{text-align:center;font-family:"Courier New",monospace;font-weight:700;
    color:var(--dirt);margin-bottom:40px}

  /* info cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}
  .card{
    background:#fff;border:4px solid var(--ink);padding:24px;
    box-shadow:8px 8px 0 rgba(0,0,0,.25);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{transform:translate(-3px,-3px);box-shadow:12px 12px 0 rgba(0,0,0,.3)}
  .card .ico{font-size:2.2rem;margin-bottom:10px;display:block}
  .card h3{font-size:1.15rem;margin-bottom:8px;color:var(--dirt-dark)}
  .card p{font-family:"Trebuchet MS",sans-serif;line-height:1.5;font-size:.95rem}

  /* rules */
  .rules-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
  .rule{
    background:#fff;border-left:10px solid var(--grass);
    border-top:3px solid var(--ink);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);
    padding:18px 20px;box-shadow:6px 6px 0 rgba(0,0,0,.2);
    display:flex;gap:14px;align-items:flex-start;
  }
  .rule.allow{border-left-color:var(--grass)}
  .rule.warn{border-left-color:var(--gold)}
  .rule.ban{border-left-color:var(--redstone)}
  .rule .tag2{
    font-family:"Courier New",monospace
